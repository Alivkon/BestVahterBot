services:
  bestvahter-bot:
    build: .
    image: bestvahterbot:latest
    container_name: bestvahter_bot
    restart: always
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    stop_grace_period: 30s
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Боту нужен только исходящий доступ к api.telegram.org — порты не публикуем
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
